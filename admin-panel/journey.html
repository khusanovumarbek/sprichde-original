<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>SprichDe · 91 kunlik sayohat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<script src="theme.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="application-name" content="SprichDe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SprichDe">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script src="pwa.js" defer></script>
<link rel="stylesheet" href="theme.css">
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;--blue:var(--primary);--blue-dark:var(--primary-2);--muted:#788196;--line:#e9ebf2;--soft:#e7efff;--shadow:0 10px 26px #1d2b4b0f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text)}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:5}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;text-decoration:none;color:var(--text)}
.topbar b{font-size:16px;font-weight:800}
.wrap{max-width:520px;margin:0 auto;padding:22px 20px 60px}
.intro{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.intro small{font-size:10.5px;font-weight:800;letter-spacing:2px;color:#ffffffcc}
.intro b{display:block;font-size:22px;font-weight:800;margin-top:6px}
.intro p{margin:6px 0 0;font-size:12.5px;color:#ffffffd9}
.days{margin-top:14px;display:grid;gap:14px}
.day{display:flex;align-items:center;gap:17px;padding:17px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.day .d-num{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--blue);flex:none}
.day{position:relative}
.day-icon-wrap{position:relative;flex:none}
.day-icon{width:48px;height:48px;border:0;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:23px;cursor:pointer;box-shadow:0 2px 8px #1d2b4b0d;transition:transform .18s,background .18s}
.day-icon:hover,.day-icon:focus-visible{transform:translateY(-2px) scale(1.04);outline:2px solid var(--blue);outline-offset:2px}
.day.done .day-icon{background:#e7f6ec}
.word-pop{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,6px);width:max-content;max-width:min(250px,75vw);padding:9px 12px;border-radius:11px;background:#1c2942;color:#fff;font-size:12px;font-weight:700;line-height:1.45;text-align:center;box-shadow:0 8px 22px #101a3033;opacity:0;visibility:hidden;pointer-events:none;transition:.16s;z-index:4}
.word-pop::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1c2942}
.day-icon-wrap.open .word-pop{opacity:1;visibility:visible;transform:translate(-50%,0)}
.day .d-body{flex:1;min-width:0}
.day .d-body b{display:block;font-size:14px;font-weight:700}
.day .d-body small{font-size:11.5px;color:var(--muted)}
.day .d-state{font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;flex:none}
.day.done{border-color:#bfe6cb}
html[data-theme="dark"] .day.done{border-color:#2c5c3c}
.day.done .d-num{background:#e7f6ec;color:#1d9a52}
html[data-theme="dark"] .day.done .d-num{background:#1d3a28;color:#57d18a}
.day.done .d-state{background:#e7f6ec;color:#1d9a52}
html[data-theme="dark"] .day.done .d-state{background:#1d3a28;color:#57d18a}
.day .d-state.locked{background:var(--surface-2);color:var(--muted)}
.note{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center}
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="app.html">‹</a>
  <b>91 kunlik sayohat</b>
</header>

<div class="wrap">
  <div class="intro">
    <small>SAYOHAT</small>
    <b>91 kunlik sayohat</b>
    <p>Har kuni bir qadam — katta natija sari. Sinov darsini o‘tib, sayohatni boshlang.</p>
    <div class="j-count" id="journeyCount">0 / 91 kun</div>
  </div>

  <div class="days" id="dayList"></div>

  <p class="note">Sahifa tayyorlanmoqda — keyingi kunlar bosqichma-bosqich qo‘shiladi.</p>
</div>

<script>
const TOTAL_DAYS = 91;
const lessonTitles = [
  { title: 'Salomlashish — Hallo, Guten Tag', icon: '👋', words: 'Hallo — Salom · Guten Tag — Xayrli kun' },
  { title: 'Kundalik tanishuv — Wie heißt du?', icon: '🤝', words: 'Wie heißt du? — Isming nima? · Ich heiße… — Mening ismim…' },
  { title: 'Kafe va buyurtma — Ich möchte…', icon: '☕', words: 'Ich möchte einen Kaffee — Men qahva xohlayman · Bitte — Iltimos' },
  { title: 'Oila — die Familie', icon: '👨‍👩‍👧', words: 'die Familie — Oila · die Mutter — Ona · der Vater — Ota' },
];

function paintDays(completedDays) {
  const list = document.getElementById('dayList');
  const done = Array.isArray(completedDays) ? completedDays : [];
  list.innerHTML = lessonTitles.map((lesson, i) => {
    const n = i + 1;
    const isDone = done.includes(n);
    return `
      <div class="day ${isDone ? 'done' : ''}">
        <span class="d-num">${isDone ? '✓' : n}</span>
        <span class="day-icon-wrap">
          <button class="day-icon" type="button" aria-label="${lesson.title} so‘zlari" aria-expanded="false">${lesson.icon}</button>
          <span class="word-pop" role="status">${lesson.words}</span>
        </span>
        <span class="d-body"><b>${lesson.title}</b><small>${n}-kun</small></span>
        <span class="d-state ${isDone ? '' : 'locked'}">${isDone ? 'O‘tilgan' : 'Yopiq'}</span>
      </div>`;
  }).join('');
  list.querySelectorAll('.day-icon').forEach((button) => {
    button.addEventListener('click', (event) => {
      event.stopPropagation();
      const wrap = button.closest('.day-icon-wrap');
      const wasOpen = wrap.classList.contains('open');
      list.querySelectorAll('.day-icon-wrap').forEach((item) => {
        item.classList.remove('open');
        item.querySelector('.day-icon')?.setAttribute('aria-expanded', 'false');
      });
      if (!wasOpen) {
        wrap.classList.add('open');
        button.setAttribute('aria-expanded', 'true');
      }
    });
  });
  document.getElementById('journeyCount').textContent = done.length + ' / ' + TOTAL_DAYS + ' kun';
}

document.addEventListener('click', () => {
  document.querySelectorAll('.day-icon-wrap.open').forEach((wrap) => {
    wrap.classList.remove('open');
    wrap.querySelector('.day-icon')?.setAttribute('aria-expanded', 'false');
  });
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') document.querySelectorAll('.day-icon-wrap.open').forEach((wrap) => {
    wrap.classList.remove('open');
    wrap.querySelector('.day-icon')?.setAttribute('aria-expanded', 'false');
  });
});

(async function initJourney() {
  const me = await guard('student');
  if (!me) return;
  try {
    const data = await authFetch('/api/progress');
    paintDays(data.completedDays);
  } catch {
    paintDays([]);
  }
})();
</script>
</body>
</html>
